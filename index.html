<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;box-sizing:border-box;background:#f3f5ef;color:#1c2418;font-family:system-ui,-apple-system,sans-serif;text-align:center}

<body>

<a id="go" href="https://claude.ai/artifact/W1aQkzbVoNYmoewwh7Tjrc">Abrir app</a>
<p>Para ponerla en la pantalla de inicio: iPhone → Compartir → "Agregar a inicio". Android → menú ⋮ → "Agregar a la pantalla principal".</p>
<script>
// Abre la app sola. Con ?instalar en el link se queda aquí para poder agregar el ícono,
// y limpia el link para que el ícono abra la app directo.
if (/instalar/.test(location.search)) { history.replaceState(null, '', location.pathname); }
else { setTimeout(function(){ location.href = document.getElementById('go').href; }, 500); }
</script>
